services:
  db:
    image: postgres:16-alpine
    container_name: propostas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propostas_db}
      POSTGRES_USER: ${POSTGRES_USER:-propostas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propostas}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propostas} -d ${POSTGRES_DB:-propostas_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propostas_app
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    user: "${ADBALANCAS_UID:-10001}:${ADBALANCAS_GID:-10001}"
    environment:
      APP_ENV_FILE: /dev/null
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: "false"
      LLM_PROVIDER: gemini
      LIBREOFFICE_CMD: /usr/bin/soffice
      TEMPLATE_DOC_PATH: /app/data/doc_templates/proposta_template.docx
      TECHNICAL_REPORT_TEMPLATE_PATH: /app/doc_templates/relatorio_tecnico_template.docx
      OUTPUT_DIR: /app/data/output
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-90}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
      VOICE_ENABLED: "true"
      VOICE_MODEL_DIR: /app/.models/assistant_voice
      VOICE_WHISPER_MODEL: ${VOICE_WHISPER_MODEL:-small}
      VOICE_WHISPER_DEVICE: cpu
      VOICE_WHISPER_COMPUTE_TYPE: int8
      VOICE_LANGUAGE: pt
      VOICE_PIPER_MODEL_PATH: /app/.models/assistant_voice/pt_BR-faber-medium.onnx
      HF_HUB_OFFLINE: "1"
      TESSERACT_CMD: /usr/bin/tesseract
      TESSERACT_DATA_DIR: /usr/share/tesseract-ocr/5/tessdata
      ASSISTANT_TIMEZONE: ${ASSISTANT_TIMEZONE:-America/Recife}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8013:8000"
    volumes:
      - ./output:/app/data/output
      - ../local-data/adbalancas-8013/doc_templates:/app/data/doc_templates:ro
      - ./.models/assistant_voice:/app/.models/assistant_voice:rw
      - ./doc_templates:/app/doc_templates:ro
      - ./.env:/run/local-config/.env:ro
      - ./.env.yahoo.local:/run/local-config/.env.yahoo.local:ro
    secrets:
      - source: proposals_database_url
        target: database-url
      - source: auth_session_secret
        target: auth-session-secret
      - source: local_runtime_settings
        target: runtime-settings.json
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:

secrets:
  proposals_database_url:
    file: ../local-data/adbalancas-8013/private/database-url
  auth_session_secret:
    file: ../local-data/adbalancas-8013/private/auth-session-secret
  local_runtime_settings:
    file: ../local-data/adbalancas-8013/private/settings.json
