services:
  db:
    image: postgres:16-alpine
    container_name: propostas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propostas_db}
      POSTGRES_USER: ${POSTGRES_USER:-propostas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propostas}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propostas} -d ${POSTGRES_DB:-propostas_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propostas_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://propostas:propostas@db:5432/propostas_db}
      LIBREOFFICE_CMD: ${LIBREOFFICE_CMD:-/usr/bin/soffice}
      TEMPLATE_DOC_PATH: ${TEMPLATE_DOC_PATH:-/app/doc_templates/proposta_template.docx}
      OUTPUT_DIR: ${OUTPUT_DIR:-/app/output}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      APP_RELOAD: ${APP_RELOAD:-false}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-90}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-3}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-60}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-180}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_CONNECT_TIMEOUT: ${GEMINI_CONNECT_TIMEOUT:-3}
      GEMINI_READ_TIMEOUT: ${GEMINI_READ_TIMEOUT:-60}
      ASSISTANT_TIMEZONE: ${ASSISTANT_TIMEZONE:-America/Recife}
      ASSISTANT_CONTEXT_MESSAGES: ${ASSISTANT_CONTEXT_MESSAGES:-12}
      ASSISTANT_REQUEST_LEASE_SECONDS: ${ASSISTANT_REQUEST_LEASE_SECONDS:-120}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_MODEL_DIR: ${VOICE_MODEL_DIR:-/app/.models/assistant_voice}
      VOICE_WHISPER_MODEL: ${VOICE_WHISPER_MODEL:-small}
      VOICE_WHISPER_DEVICE: ${VOICE_WHISPER_DEVICE:-cpu}
      VOICE_WHISPER_COMPUTE_TYPE: ${VOICE_WHISPER_COMPUTE_TYPE:-int8}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-pt}
      VOICE_WHISPER_INITIAL_PROMPT: ${VOICE_WHISPER_INITIAL_PROMPT:-Crie uma tarefa. Pode criar. Sim, confirmo. Nao, cancela.}
      VOICE_PIPER_MODEL_PATH: ${VOICE_PIPER_MODEL_PATH:-/app/.models/assistant_voice/pt_BR-faber-medium.onnx}
      VOICE_MAX_UPLOAD_BYTES: ${VOICE_MAX_UPLOAD_BYTES:-8388608}
      VOICE_MIN_DURATION_SECONDS: ${VOICE_MIN_DURATION_SECONDS:-0.25}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-30}
      VOICE_TRANSCRIPTION_TIMEOUT_SECONDS: ${VOICE_TRANSCRIPTION_TIMEOUT_SECONDS:-60}
      VOICE_SYNTHESIS_TIMEOUT_SECONDS: ${VOICE_SYNTHESIS_TIMEOUT_SECONDS:-30}
      VOICE_SILENCE_MS: ${VOICE_SILENCE_MS:-1200}
      VOICE_IDLE_TIMEOUT_SECONDS: ${VOICE_IDLE_TIMEOUT_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./output:/app/output
      - ./doc_templates:/app/doc_templates
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_PORT:-8000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
