services:
  db:
    image: postgres:16-alpine
    container_name: propostas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propostas_db}
      POSTGRES_USER: ${POSTGRES_USER:-propostas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propostas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propostas} -d ${POSTGRES_DB:-propostas_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propostas_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://propostas:propostas@db:5432/propostas_db}
      LIBREOFFICE_CMD: ${LIBREOFFICE_CMD:-/usr/bin/soffice}
      TEMPLATE_DOC_PATH: ${TEMPLATE_DOC_PATH:-/app/doc_templates/proposta_template.docx}
      OUTPUT_DIR: ${OUTPUT_DIR:-/app/output}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      APP_RELOAD: ${APP_RELOAD:-false}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-90}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./output:/app/output
      - ./doc_templates:/app/doc_templates
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_PORT:-8000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
