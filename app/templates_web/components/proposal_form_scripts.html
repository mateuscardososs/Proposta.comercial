<script>
  function parseNumberBR(value) {
    if (!value) return 0;
    let normalized = String(value).trim().replace(/\s/g, "");
    const hasComma = normalized.includes(",");
    const hasDot = normalized.includes(".");

    if (hasComma && hasDot) {
      if (normalized.lastIndexOf(",") > normalized.lastIndexOf(".")) {
        normalized = normalized.replace(/\./g, "").replace(",", ".");
      } else {
        normalized = normalized.replace(/,/g, "");
      }
    } else if (hasComma) {
      normalized = normalized.replace(",", ".");
    }

    const n = Number(normalized);
    return Number.isFinite(n) ? n : 0;
  }

  function formatBR(value) {
    return value.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatBRL(value) {
    return `R$ ${formatBR(value)}`;
  }

  function formatDate(dateText) {
    if (!dateText) return "-";
    const parts = String(dateText).split("-");
    if (parts.length !== 3) return dateText;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function escapeAttr(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function updateItemIndexes() {
    document.querySelectorAll("#itemsBody .item-index").forEach((cell, index) => {
      cell.innerText = String(index + 1);
    });
    const countField = document.getElementById("items_count");
    if (countField) {
      countField.value = String(document.querySelectorAll("#itemsBody tr").length);
    }
  }

  function updateScheduleIndexes() {
    document.querySelectorAll("#scheduleBody .schedule-index").forEach((cell, index) => {
      cell.innerText = String(index + 1);
    });
  }

  function computeItems() {
    let total = 0;

    document.querySelectorAll("#itemsBody tr").forEach((row) => {
      const qtd = parseNumberBR(row.querySelector(".item-qtd")?.value);
      const valor = parseNumberBR(row.querySelector(".item-valor")?.value);
      const lineTotal = qtd * valor;
      total += lineTotal;
      const out = row.querySelector(".item-total");
      if (out) out.value = formatBR(lineTotal);
    });

    document.getElementById("items_subtotal").value = formatBRL(total);
    document.getElementById("aside_items_total").value = formatBRL(total);
    return total;
  }

  function computeLogistics() {
    const kmIda = parseNumberBR(document.getElementById("km_ida").value);
    const kmVolta = parseNumberBR(document.getElementById("km_volta").value);
    const kmValor = parseNumberBR(document.getElementById("km_valor").value);
    const refeicoes = parseNumberBR(document.getElementById("alim_refeicoes").value);
    const alimValor = parseNumberBR(document.getElementById("alim_valor").value);

    const kmTotal = kmIda + kmVolta;
    const deslocTotal = kmTotal * kmValor;
    const alimTotal = refeicoes * alimValor;

    document.getElementById("km_total").value = formatBR(kmTotal);
    document.getElementById("desloc_total").value = formatBRL(deslocTotal);
    document.getElementById("alim_total").value = formatBRL(alimTotal);

    document.getElementById("aside_desloc_total").value = formatBRL(deslocTotal);
    document.getElementById("aside_alim_total").value = formatBRL(alimTotal);

    return { deslocTotal, alimTotal };
  }

  function recompute() {
    const itensTotal = computeItems();
    const logistics = computeLogistics();
    const total = itensTotal + logistics.deslocTotal + logistics.alimTotal;

    document.getElementById("subtotal_with_extras").value = formatBRL(total);
    document.getElementById("valor_total_text").innerText = formatBRL(total);
    document.getElementById("aside_grand_total").value = formatBRL(total);
  }

  function addItemRow(values = {}) {
    const tbody = document.getElementById("itemsBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="item-index">0</td>
      <td><input name="item_descricao" value="${escapeAttr(values.descricao)}" placeholder="Descricao detalhada"></td>
      <td><input name="item_unidade" value="${escapeAttr(values.unidade || "UN")}" placeholder="UN"></td>
      <td><input name="item_qtd" value="${escapeAttr(values.qtd || "1")}" class="item-qtd" inputmode="decimal"></td>
      <td><input name="item_valor_unit" value="${escapeAttr(values.valor_unit || "0")}" class="item-valor" inputmode="decimal"></td>
      <td><input value="0,00" class="item-total" readonly></td>
      <td><button type="button" class="btn btn-danger remove-item" aria-label="Remover item">X</button></td>
    `;
    tbody.appendChild(tr);
    updateItemIndexes();
  }

  function addScheduleRow(values = {}) {
    const tbody = document.getElementById("scheduleBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="schedule-index">0</td>
      <td><input name="schedule_dia_label" value="${escapeAttr(values.dia_label || "")}" placeholder="Ex.: Dia 1"></td>
      <td><input name="schedule_descricao" value="${escapeAttr(values.descricao || "")}" placeholder="Atividade prevista"></td>
      <td><input name="schedule_horas_servico" value="${escapeAttr(values.horas_servico || "")}" placeholder="Ex.: 8h"></td>
      <td><button type="button" class="btn btn-danger remove-schedule" aria-label="Remover etapa">X</button></td>
    `;
    tbody.appendChild(tr);
    updateScheduleIndexes();
  }

  function renderRecentProposals(proposals) {
    const section = document.getElementById("recentProposalsSection");
    const tbody = document.getElementById("recentProposalsBody");
    section.style.display = "block";

    if (!proposals || proposals.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="muted">Nenhuma proposta recente encontrada para este cliente.</td></tr>';
      return;
    }

    tbody.innerHTML = proposals.map((proposal) => `
      <tr>
        <td><strong>${proposal.numero}/${proposal.revisao}</strong></td>
        <td>${formatDate(proposal.data_geracao)}</td>
        <td>${proposal.objeto_texto || "-"}</td>
        <td><strong>${formatBRL(parseNumberBR(proposal.valor_total))}</strong></td>
        <td>${proposal.responsavel_nome || "-"}</td>
        <td>
          <button type="button" class="btn btn-secondary clone-proposal-btn" data-proposal-id="${proposal.id}">Clonar</button>
        </td>
      </tr>
    `).join("");
  }

  async function fetchRecentProposals(clientId) {
    const section = document.getElementById("recentProposalsSection");
    const tbody = document.getElementById("recentProposalsBody");

    if (!clientId) {
      section.style.display = "none";
      return;
    }

    section.style.display = "block";
    tbody.innerHTML = '<tr><td colspan="6" class="muted">Carregando...</td></tr>';

    try {
      const response = await fetch(`/api/clients/${encodeURIComponent(clientId)}/recent-proposals`);
      if (!response.ok) {
        throw new Error("Falha ao carregar propostas recentes.");
      }
      const proposals = await response.json();
      renderRecentProposals(proposals);
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" class="muted">Nao foi possivel carregar o historico agora.</td></tr>';
    }
  }

  async function cloneProposal(proposalId) {
    try {
      const response = await fetch(`/api/proposals/${encodeURIComponent(proposalId)}/clone`, {
        method: "POST",
      });
      if (!response.ok) {
        throw new Error("Falha ao clonar proposta.");
      }
      const payload = await response.json();
      if (payload.redirect_url) {
        window.location.href = payload.redirect_url;
      } else {
        alert("Proposta clonada, mas sem URL de redirecionamento.");
      }
    } catch (err) {
      alert("Nao foi possivel clonar a proposta selecionada.");
    }
  }

  async function autofillClientContext(clientId) {
    const hint = document.getElementById("clientHint");
    if (!clientId) {
      hint.textContent = "Selecione um cliente para preencher contexto.";
      return;
    }

    try {
      const response = await fetch(`/api/clients/${encodeURIComponent(clientId)}`);
      if (!response.ok) {
        throw new Error("Falha ao carregar dados do cliente.");
      }

      const client = await response.json();
      const atencaoField = document.getElementById("atencao");
      const contatoField = document.getElementById("contato_nome");
      const localField = document.getElementById("local_servico");

      if (atencaoField && !String(atencaoField.value || "").trim()) {
        atencaoField.value = client.contato_padrao || "";
      }
      if (contatoField && !String(contatoField.value || "").trim()) {
        contatoField.value = client.contato_padrao || "";
      }
      if (localField && !String(localField.value || "").trim()) {
        localField.value = client.cidade_uf || "";
      }

      hint.textContent = `Cliente selecionado: ${client.razao_social}`;
    } catch (err) {
      hint.textContent = "Cliente selecionado, mas sem autofill disponivel no momento.";
    }
  }

  async function loadLastWordProposal(clientId) {
    const panel = document.getElementById("lastWordProposalPanel");
    const message = document.getElementById("lastWordProposalText");
    const actions = document.getElementById("lastWordProposalActions");
    const downloadLink = document.getElementById("lastWordDownloadLink");
    const reuploadLink = document.getElementById("lastWordReuploadLink");
    panel.hidden = true;
    actions.hidden = true;
    if (!clientId) return;

    try {
      const response = await fetch(`/api/proposals/clients/${encodeURIComponent(clientId)}/last`);
      if (!response.ok) throw new Error("Falha ao consultar a última proposta.");
      const proposal = await response.json();
      if (!proposal) return;
      panel.hidden = false;
      if (!proposal.docx_path) {
        message.textContent = `A proposta ${proposal.numero}/${proposal.revisao} não possui arquivo Word disponível.`;
        return;
      }
      message.textContent = `Proposta ${proposal.numero}/${proposal.revisao}, gerada em ${formatDate(proposal.data_geracao)}.`;
      downloadLink.href = `/web/proposals/${proposal.id}/baixar-word`;
      reuploadLink.href = `/web/proposals/${proposal.id}/reenviar-word`;
      actions.hidden = false;
    } catch (error) {
      panel.hidden = false;
      message.textContent = "Não foi possível consultar a última proposta agora.";
    }
  }

  function syncObjetoField() {
    const tipo = document.getElementById("objeto_tipo").value;
    const wrap = document.getElementById("objeto_texto_wrap");
    const field = document.getElementById("objeto_texto");

    wrap.style.display = tipo === "outro" ? "block" : "none";
    field.placeholder = tipo === "outro" ? "Descreva o objeto" : "Opcional";
  }

  function setupShortcuts() {
    document.addEventListener("keydown", (event) => {
      if (event.altKey && event.key === "1") {
        event.preventDefault();
        addItemRow();
        recompute();
        return;
      }

      if (event.altKey && event.key === "2") {
        event.preventDefault();
        addScheduleRow();
        return;
      }

      if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        document.getElementById("submitProposalBtn").click();
      }
    });
  }

  document.getElementById("addItem").addEventListener("click", () => {
    addItemRow();
    recompute();
  });

  document.getElementById("addScheduleRow").addEventListener("click", () => {
    addScheduleRow();
  });

  document.getElementById("itemsBody").addEventListener("click", (ev) => {
    if (ev.target.classList.contains("remove-item")) {
      const rows = document.querySelectorAll("#itemsBody tr");
      if (rows.length === 1) return;
      ev.target.closest("tr").remove();
      updateItemIndexes();
      recompute();
    }
  });

  document.getElementById("scheduleBody").addEventListener("click", (ev) => {
    if (ev.target.classList.contains("remove-schedule")) {
      const rows = document.querySelectorAll("#scheduleBody tr");
      if (rows.length === 1) return;
      ev.target.closest("tr").remove();
      updateScheduleIndexes();
    }
  });

  document.getElementById("recentProposalsBody").addEventListener("click", (ev) => {
    const button = ev.target.closest(".clone-proposal-btn");
    if (!button) return;
    const proposalId = button.getAttribute("data-proposal-id");
    if (!proposalId) return;
    cloneProposal(proposalId);
  });

  document.getElementById("proposalForm").addEventListener("input", recompute);

  document.getElementById("client_id").addEventListener("change", (ev) => {
    const clientId = ev.target.value;
    fetchRecentProposals(clientId);
    autofillClientContext(clientId);
    loadLastWordProposal(clientId);
  });

  document.getElementById("btnLoadLast").addEventListener("click", () => {
    const clientId = document.getElementById("client_id").value;
    if (!clientId) {
      alert("Selecione um cliente antes de carregar a ultima proposta.");
      return;
    }
    window.location.href = `/web/proposals/new?client_id=${encodeURIComponent(clientId)}&load_last=1`;
  });

  document.getElementById("objeto_tipo").addEventListener("change", syncObjetoField);

  const initialClientId = document.getElementById("client_id").value;
  if (initialClientId) {
    fetchRecentProposals(initialClientId);
    autofillClientContext(initialClientId);
    loadLastWordProposal(initialClientId);
  }

  updateItemIndexes();
  updateScheduleIndexes();
  syncObjetoField();
  setupShortcuts();
  recompute();
</script>
