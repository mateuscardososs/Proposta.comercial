  <style>
    :root {
      --canvas: #f3f4f5;
      --surface: #ffffff;
      --surface-muted: #f7f8f9;
      --surface-active: #edf1f4;
      --line: #e1e5e8;
      --line-strong: #cbd2d8;
      --text: #18232d;
      --text-soft: #66727d;
      --text-faint: #87919a;
      --brand: #183f62;
      --brand-dark: #102f4a;
      --brand-soft: #e8f0f6;
      --accent: #277355;
      --warning: #986515;
      --warning-soft: #fff2d9;
      --danger: #b83c3c;
      --danger-soft: #fdeaea;
      --focus: rgba(43, 118, 174, 0.24);
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 0 0 1px rgba(21, 31, 40, .04), 0 2px 5px rgba(21, 31, 40, .04);
      --shadow-md: 0 12px 32px rgba(21, 31, 40, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Barlow", "Aptos", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--canvas);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--brand-dark); }

    .shell {
      width: 100%;
      margin: 0;
      padding: 0 18px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 58px;
      padding: 7px 0;
    }

    .topbar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-width: 0;
    }

    .brand-block {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--text-soft);
      font-size: 10px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      width: 100%;
      min-width: 0;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-dark);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      padding: 0;
      flex: 0 0 auto;
    }

    .menu-toggle:hover {
      border-color: var(--line-strong);
      background: #f8fbff;
    }

    .menu-toggle-label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      clip: rect(0, 0, 0, 0);
      overflow: hidden;
    }

    .nav a {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .nav a:hover {
      border-color: var(--line-strong);
      background: #f8fbff;
    }

    .nav a.active {
      border-color: transparent;
      color: var(--text);
      background: var(--surface-active);
      box-shadow: inset 3px 0 var(--brand);
    }

    .app-frame { min-height: calc(100vh - 58px); display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 0; align-items: stretch; }
    .sidebar { position: sticky; top: 58px; height: calc(100vh - 58px); overflow: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 14px; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; margin-bottom: 16px; border-bottom: 1px solid #eff1f3; }
    .sidebar-brand-mark { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 9px; background: var(--brand-dark); color: #fff; font-size: 13px; font-weight: 800; }
    .sidebar-brand-copy { min-width: 0; }
    .sidebar-brand-copy strong { display: block; font-size: 13px; line-height: 1.2; }
    .sidebar-brand-copy span { color: var(--text-faint); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
    .sidebar .nav { display: block; }
    .nav-group { margin-top: 16px; }
    .nav-group:first-child { margin-top: 0; }
    .nav-group-title { margin: 0; padding: 0 10px 6px; color: var(--text-faint); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .sidebar .nav a { display: flex; gap: 10px; align-items: center; width: 100%; min-height: 36px; margin: 2px 0; border: 0; border-radius: var(--radius-sm); padding: 8px 10px; color: #4f5963; background: transparent; box-shadow: none; }
    .sidebar .nav a:hover { color: var(--text); background: var(--surface-muted); }
    .sidebar .nav a.active { color: var(--text); background: var(--surface-active); box-shadow: inset 3px 0 var(--brand); }
    .nav-mark { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: 0 0 18px; color: #68727c; background: transparent; }
    .nav-mark svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar .nav a.active .nav-mark { color: var(--brand); background: transparent; }
    .app-frame.is-collapsed { grid-template-columns: 72px minmax(0, 1fr); }
    .app-frame.is-collapsed .sidebar { padding-inline: 10px; }
    .app-frame.is-collapsed .sidebar-brand { justify-content: center; padding-inline: 0; }
    .app-frame.is-collapsed .sidebar-brand-copy,
    .app-frame.is-collapsed .nav-group-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .app-frame.is-collapsed .sidebar .nav-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .app-frame.is-collapsed .sidebar .nav a { justify-content: center; padding: 9px 4px; }
    .app-frame.is-collapsed .nav-mark { width: 24px; height: 24px; flex-basis: 24px; }
    .topbar-inner { align-items: center; }
    .topbar-head { width: auto; }
    .menu-toggle { display: inline-flex; }
    .skip-link { position: absolute; left: 8px; top: -80px; z-index: 100; padding: 10px; border-radius: 8px; background: #fff; color: var(--brand-dark); }
    .skip-link:focus { top: 8px; }
    .breadcrumbs { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; color: var(--text-soft); font-size: 13px; }
    .breadcrumbs a { font-weight: 700; }
    .breadcrumbs button { border: 0; padding: 0; background: transparent; color: var(--brand-dark); text-decoration: underline; cursor: pointer; font: inherit; }
    .today-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .today-counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .today-workspace { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, .75fr); gap: 14px; }
    .today-secondary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .today-panel { min-width: 0; padding: 0; overflow: hidden; }
    .today-panel > .card-head { padding: 14px 16px; margin: 0; border-bottom: 1px solid var(--line); }
    .today-panel > .muted { display: block; padding: 14px 16px; margin: 0; }
    .today-section-heading { display: flex; align-items: center; gap: 10px; }
    .calibration-mark { display: flex; align-items: end; gap: 2px; width: 18px; height: 16px; }
    .calibration-mark i { display: block; width: 2px; border-radius: 1px; background: var(--warning); }
    .calibration-mark i:nth-child(1), .calibration-mark i:nth-child(5) { height: 5px; }
    .calibration-mark i:nth-child(2), .calibration-mark i:nth-child(4) { height: 9px; }
    .calibration-mark i:nth-child(3) { height: 14px; }
    .text-link { color: var(--brand); font-size: 12px; font-weight: 700; text-decoration: none; }
    .text-link:hover { text-decoration: underline; }
    .today-items, .message-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .today-panel .today-items { gap: 0; }
    .today-item, .message-item { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); padding: 14px; }
    .today-panel .today-item { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 13px 16px; }
    .today-panel .today-item:last-child { border-bottom: 0; }
    .today-item { display: flex; gap: 14px; align-items: center; justify-content: space-between; border-left: 3px solid var(--accent); }
    .today-item-overdue { border-left-color: var(--danger); }
    .today-item-main { min-width: 0; }
    .today-item-meta, .message-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .today-item h3, .message-item h3 { margin: 9px 0 4px; font-size: 17px; }
    .today-item p, .message-item p { margin: 4px 0; color: var(--text-soft); }
    .today-secondary summary { cursor: pointer; display: grid; gap: 4px; }
    .today-secondary summary span { color: var(--text-soft); font-size: 13px; }
    .today-compact-list { list-style: none; margin: 0; padding: 0; }
    .today-compact-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .today-compact-list li:last-child { border-bottom: 0; }
    .today-compact-list strong { display: block; font-size: 13px; }
    .today-compact-list strong a { color: var(--text); text-decoration: none; }
    .today-compact-list strong a:hover { color: var(--brand); text-decoration: underline; }
    .today-compact-list li div > span { display: block; margin-top: 3px; color: var(--text-soft); font-size: 11px; line-height: 1.45; }
    .today-compact-list time { color: var(--text-soft); font-size: 11px; white-space: nowrap; }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .sync-status { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin: 0; }
    .sync-status div { background: var(--surface-muted); border-radius: 10px; padding: 12px; }
    .sync-status dt { color: var(--text-soft); font-size: 12px; }
    .sync-status dd { margin: 4px 0 0; font-weight: 700; overflow-wrap: anywhere; }
    .message-heading { justify-content: space-between; }
    .message-sender { font-size: 13px; }
    .message-reason { font-size: 13px; }
    .review-form { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 10px; }
    .review-form label { display: grid; gap: 5px; font-size: 13px; }

    .app-main {
      min-width: 0;
      padding: 22px 24px 28px;
      max-width: none;
      margin: 0;
      background: var(--canvas);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }

    .layout-grid.full-width {
      grid-template-columns: minmax(0, 1fr);
    }

    .content-stack,
    .aside-stack {
      display: grid;
      gap: 14px;
    }

    .page-header {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      padding: 18px;
      box-shadow: none;
    }

    .page-title {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .page-subtitle {
      margin: 8px 0 0;
      color: var(--text-soft);
      font-size: 14px;
    }

    .meta-line {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-soft);
    }

    .badge.primary {
      border-color: rgba(13, 90, 157, 0.32);
      color: var(--brand-dark);
      background: #e8f2fc;
    }

    .badge.success {
      border-color: rgba(29, 143, 110, 0.3);
      color: #0f5c46;
      background: #e7f7f1;
    }

    .badge.warning {
      border-color: rgba(181, 89, 31, 0.26);
      color: #844013;
      background: #fff1e8;
    }

    .badge.danger {
      border-color: rgba(178, 51, 62, 0.3);
      color: #8b202b;
      background: #fdecee;
    }

    .alert {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 12px;
      background: var(--surface-muted);
      color: var(--text);
    }

    .alert.error,
    .alert.danger {
      border: 1px solid rgba(178, 51, 62, 0.3);
      border-radius: var(--radius-sm);
      background: #fdecee;
      color: #8b202b;
    }

    .alert.info {
      border-color: rgba(13, 90, 157, 0.28);
      background: #e8f2fc;
      color: var(--brand-dark);
    }

    .alert.warning {
      border-color: rgba(181, 89, 31, 0.28);
      background: #fff1e8;
      color: #844013;
    }

    .check-row { display: flex; align-items: flex-start; gap: 8px; }
    .form-stack { display: grid; gap: 8px; max-width: 560px; }
    .form-stack label { display: grid; gap: 4px; }
    details > summary { cursor: pointer; width: fit-content; }
    details[open] > summary { margin-bottom: 8px; }

    .alert.error {
      border: 1px solid rgba(178, 51, 62, 0.3);
      background: #fdecee;
      color: #8b202b;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: none;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0.2px;
    }

    .card-subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-soft);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }

    .kpi-card.is-danger {
      border-color: var(--danger);
      background: #fff2f3;
    }

    .kpi-card.is-danger .kpi-value {
      color: var(--danger);
    }

    .kpi-label {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-soft);
      font-weight: 700;
    }

    .kpi-value {
      margin: 8px 0 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
      color: #0f3050;
    }

    .kpi-note {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-soft);
    }

    .form-grid-1,
    .form-grid-2,
    .form-grid-3,
    .form-grid-4 {
      display: grid;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-grid-1 { grid-template-columns: minmax(0, 1fr); }
    .form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .form-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .field {
      min-width: 0;
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-soft);
      margin-bottom: 6px;
    }

    .field.required label::after {
      content: "Obrigatorio";
      font-size: 10px;
      letter-spacing: 0.2px;
      font-weight: 700;
      color: #fff;
      background: var(--danger);
      border-radius: 999px;
      padding: 2px 7px;
      text-transform: none;
    }

    .field .hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-soft);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      padding: 9px 11px;
      font-size: 14px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8ea0b8;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--focus);
    }

    input[readonly],
    textarea[readonly] {
      background: var(--surface-muted);
      color: #34465f;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: auto;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      min-width: 680px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 10px 9px;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f3f7fc;
      color: #2f425a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.35px;
    }

    tr:last-child td { border-bottom: 0; }

    .row-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions > .btn,
    .actions > form .btn {
      max-width: 100%;
    }

    .mobile-collapsible .collapse-toggle {
      display: none;
      width: 100%;
      border: 1px solid var(--line);
      background: #f5f8fd;
      color: #254563;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1px;
      cursor: pointer;
      text-align: left;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .mobile-collapsible .collapse-toggle .icon {
      transition: transform 0.2s ease;
      font-size: 13px;
      color: #426286;
    }

    .mobile-collapsible.is-collapsed .collapse-toggle .icon {
      transform: rotate(-90deg);
    }

    .mobile-collapsible.is-collapsed .collapse-content {
      display: none;
    }

    .mobile-bottom-actions {
      display: none;
    }

    .actions input[type="search"] {
      width: min(100%, 280px);
    }

    .search-input {
      width: min(100%, 280px);
    }

    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .justify-center { justify-content: center; }

    .btn,
    button.btn {
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .btn:hover,
    button.btn:hover {
      filter: brightness(1.02);
      transform: translateY(-1px);
    }

    .btn:active,
    button.btn:active {
      transform: translateY(0);
    }

    .btn-primary { color: #fff; background: var(--brand); }
    .btn-success { color: #fff; background: var(--accent); }
    .btn-secondary { color: #fff; background: #53616e; }
    .btn-warning { color: #fff; background: var(--warning); }
    .btn-danger { color: #fff; background: var(--danger); }
    .btn-ghost {
      color: var(--brand-dark);
      background: #edf5ff;
      border: 1px solid rgba(13, 90, 157, 0.25);
    }

    .warning {
      background: #fff2e9;
      color: #7c360d;
      border: 1px solid #f1c5ad;
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 13px;
    }

    .muted {
      color: var(--text-soft);
      font-size: 13px;
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .empty-state { padding: 28px 18px; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); text-align: center; background: var(--surface-muted); }
    .empty-state h3 { margin: 0 0 5px; font-size: 16px; }
    .empty-state p { margin: 0 0 14px; color: var(--text-soft); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .stepper {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .step {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
