<script>
  document.addEventListener('DOMContentLoaded', () => {
    const board = document.querySelector('[data-kanban-board]');
    if (!board) return;

    const cards = board.querySelectorAll('.kanban-card');
    const dropzones = board.querySelectorAll('[data-dropzone]');
    const errorRegion = document.querySelector('[data-kanban-error]');
    let draggedCard = null;
    let originZone = null;
    let originNextSibling = null;

    function updateCounters() {
      board.querySelectorAll('.kanban-column').forEach((column) => {
        const badge = column.querySelector('.kanban-column-title .badge');
        if (badge) badge.textContent = column.querySelectorAll('.kanban-card').length;
      });
    }

    function restoreCard(card, previousZone, previousNextSibling, showError) {
      if (previousNextSibling && previousNextSibling.parentNode === previousZone) {
        previousZone.insertBefore(card, previousNextSibling);
      } else {
        previousZone.appendChild(card);
      }
      updateCounters();
      if (showError && errorRegion) {
        errorRegion.textContent = 'Não foi possível mover o card. Tente novamente.';
        errorRegion.classList.add('visible');
      }
    }

    function getDragAfterElement(container, y) {
      const elements = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
      return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        return offset < 0 && offset > closest.offset
          ? { offset, element: child }
          : closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    cards.forEach((card) => {
      card.addEventListener('dragstart', (event) => {
        draggedCard = card;
        originZone = card.parentElement;
        originNextSibling = card.nextElementSibling;
        card.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.dataset.id);
        if (errorRegion) errorRegion.classList.remove('visible');
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dropzones.forEach((zone) => zone.classList.remove('drag-over'));
      });
    });

    dropzones.forEach((zone) => {
      zone.addEventListener('dragover', (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));

      zone.addEventListener('drop', async (event) => {
        event.preventDefault();
        zone.classList.remove('drag-over');
        if (!draggedCard || !originZone) return;

        const card = draggedCard;
        const previousZone = originZone;
        const previousNextSibling = originNextSibling;
        const ordered = board.dataset.ordered === 'true';
        if (!ordered && zone === previousZone) {
          restoreCard(card, previousZone, previousNextSibling, false);
          return;
        }

        const afterElement = getDragAfterElement(zone, event.clientY);
        if (afterElement) zone.insertBefore(card, afterElement);
        else zone.appendChild(card);

        const newStatus = zone.closest('.kanban-column').dataset.status;
        const payload = { status: newStatus };
        if (ordered) {
          payload.ordem = [...zone.querySelectorAll('.kanban-card')].indexOf(card);
        }
        const endpoint = board.dataset.endpointTemplate.replace('{id}', card.dataset.id);

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            restoreCard(card, previousZone, previousNextSibling, true);
            return;
          }
          updateCounters();
        } catch (error) {
          console.error(error);
          restoreCard(card, previousZone, previousNextSibling, true);
        } finally {
          draggedCard = null;
          originZone = null;
          originNextSibling = null;
        }
      });
    });
  });
</script>
